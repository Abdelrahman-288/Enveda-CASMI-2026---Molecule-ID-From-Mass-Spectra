# Enveda CASMI 2026
# Spectrum preprocessing configuration
#
# Stage 3 baseline.
# These values are experimental defaults, not permanent assumptions.

baseline:
  min_relative_intensity: 0.0
  max_peaks: 128
  precursor_tolerance_da: null
  intensity_transform: sqrt
  normalize_intensity: true
  remove_duplicate_mz: true

